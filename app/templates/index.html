<!--
  Security Requirements Assistant - single-page chat UI.
  This file is markup only: styling lives in /static/css/style.css and all
  behavior (fetch() calls to the FastAPI routes in app/api/) lives in
  /static/js/app.js. See those files for how the page actually works.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ISO 29148 Auditor</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // Applied before first paint to avoid a flash of the wrong theme: reads the
        // user's stored preference (set by the toggle in app.js) and stamps it onto
        // <html> immediately. If nothing is stored yet, the CSS's own
        // prefers-color-scheme handling takes over (see style.css :root rules).
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) { /* localStorage unavailable - fall back to prefers-color-scheme */ }
        })();
    </script>
</head>
<body>
    <div id="toast-container"></div>
    <div class="sidebar-left">
        <div class="sidebar-top-row">
            <button class="new-chat-btn" onclick="createNewSession()">
                <i class="fas fa-plus"></i> New Chat
            </button>
            <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark theme">
                <i class="fas fa-moon" id="themeToggleIcon"></i>
            </button>
        </div>
        <div class="session-list" id="sessionList"></div>
    </div>

    <div class="main-chat">
        <button id="toggle-left" class="sidebar-toggle" onclick="toggleLeftSidebar()" title="Switch Navigation">
            <i class="fas fa-chevron-left" id="icon-left"></i>
        </button>
        <button id="toggle-right" class="sidebar-toggle" onclick="toggleRightSidebar()" title="Switch Dashboard" style="right: 10px;">
            <i class="fas fa-chevron-right" id="icon-right"></i>
        </button>
        <div class="stepper-container">
            <div class="step active" id="step-Asset" onclick="setProcessState('Asset')">
                <span class="step-badge"><span class="step-num">1</span><i class="fas fa-check step-check"></i></span>
                <span class="step-label"><i class="fas fa-shield-alt"></i> Assets</span>
            </div>
            <div class="step-connector"></div>
            <div class="step" id="step-Threat" onclick="setProcessState('Threat')">
                <span class="step-badge"><span class="step-num">2</span><i class="fas fa-check step-check"></i></span>
                <span class="step-label"><i class="fas fa-biohazard"></i> Threats</span>
            </div>
            <div class="step-connector"></div>
            <div class="step" id="step-Goal" onclick="setProcessState('Goal')">
                <span class="step-badge"><span class="step-num">3</span><i class="fas fa-check step-check"></i></span>
                <span class="step-label"><i class="fas fa-bullseye"></i> Security Goals</span>
            </div>
            <div class="step-connector"></div>
            <div class="step" id="step-Req" onclick="setProcessState('Req')">
                <span class="step-badge"><span class="step-num">4</span><i class="fas fa-check step-check"></i></span>
                <span class="step-label"><i class="fas fa-check"></i> Security Requirements</span>
            </div>
        </div>
        <div class="chat-history" id="chatHistory"></div>
        <div class="input-container">
            <div class="mode-selector">
                <button class="mode-btn active" id="mode-elicitation" onclick="setMode('elicitation')">
                    <i class="fas fa-magic"></i> Requirements Assistant (Interactive)
                </button>
                <button class="mode-btn" id="mode-audit" onclick="setMode('audit')">
                    <i class="fas fa-search"></i> ISO 29148 Review (Optional Check)
                </button>
                <button class="finalize-btn" id="finalizeBtn" onclick="finalizeStep()" title="Summarize this step into one clean, savable artifact">
                    <i class="fas fa-flag-checkered"></i> Finalize <span id="finalizeStepLabel">Asset</span>
                </button>
            </div>
            
            <div style="position: relative; display: flex; align-items: flex-end;">
                <textarea id="userInput" class="input-box" rows="1" placeholder="Enter an idea or topic (e.g., 'I need a secure login')..." oninput="autoResize(this)" onkeydown="handleEnter(event)" style="box-shadow: none; padding-right: 50px; overflow-y: hidden;"></textarea>
                
                <button id="sendBtn" onclick="sendMessage()" style="position: absolute; right: 10px; bottom: 12px; background: transparent; border: none; color: var(--accent); font-size: 1.2rem; cursor: pointer; transition: 0.2s;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
            <div id="loading">
                <span class="typing-dots"><span></span><span></span><span></span></span>
                <span id="loadingLabel">Auditor is analyzing...</span>
            </div>
        </div>
    </div>

    <div class="sidebar-right">
        <div class="doc-header">
            <i class="fas fa-file-pdf"></i> Context Docs
        </div>
        <div class="doc-list" id="docList">
            <div style="padding:10px; color:var(--text-muted); font-size:0.8em; text-align:center;">
                No user docs.<br>Supervisor knowledge active.
            </div>
        </div>
        <div class="doc-header" style="border-top: 1px solid var(--border); margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
            <span><i class="fas fa-chart-pie"></i> Project Dashboard</span>
            <i class="fas fa-download" style="cursor: pointer; font-size: 0.8em; opacity: 0.7;" onclick="exportArtifacts()" title="Export approved artifacts as Markdown"></i>
        </div>
        <div class="doc-list" id="artifactList" style="flex: 1.5; background: var(--bg-canvas); margin: 10px; border-radius: var(--radius-md); padding: 10px; overflow-y: auto;">
        </div>
        <div class="upload-area" id="dropZone">
            <input type="file" id="fileInput" style="display:none" accept=".pdf" onchange="uploadFile()">

            <i class="fas fa-cloud-upload-alt" style="font-size: 2em; margin-bottom: 8px; color: var(--text-muted); pointer-events: none;"></i>
            <p style="margin: 0; font-size: 0.85em; color: var(--text-secondary); pointer-events: none;">
                drop PDF here<br>or
            </p>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-folder-open"></i> Search for
            </button>
        </div>
    </div>

<script src="/static/js/app.js"></script>
</body>
</html>
